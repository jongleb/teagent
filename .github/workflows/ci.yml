name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev bubblewrap

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.0"

      - run: opam install . --deps-only --with-test

      - run: opam exec -- dune build

      - run: opam exec -- dune test

      - name: The bench, verbosely, when it failed
        if: failure()
        run: cd _build/default/bench && TMPDIR=/tmp opam exec -- ./bench.exe --reference --verbose 03_build

      - name: The install script is valid sh
        run: sh -n install.sh
