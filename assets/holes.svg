    </style><text x="4" y="18" font-size="14.5" font-weight="650" text-anchor="start">Holes: the model leaves a gap, fills it once the data is in, and nothing runs twice</text><rect x="10" y="40" width="428" height="318" rx="10" fill="#ece9ff" stroke="#5b4fd6" stroke-width="1.4"/><text x="26" y="64" font-size="12.5" font-weight="650" text-anchor="start">the program, after two holes were filled</text><text x="26" y="94" font-size="11" class="mono" xml:space="preserve" text-anchor="start">main =</text><text x="26" y="112" font-size="11" class="mono" xml:space="preserve" text-anchor="start">    read "lib/a.ml"</text><text x="26" y="130" font-size="11" class="mono" xml:space="preserve" text-anchor="start">        |&gt; andThen (\text -&gt;</text><rect x="44" y="142" width="382" height="184" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/><rect x="56" y="152" width="150" height="18" rx="9" fill="#ffffff" stroke="#5b4fd6" stroke-width="1.4" stroke-dasharray="5 4" class="pulse"/><text x="131" y="165" font-size="10.5" class="mono" xml:space="preserve" text-anchor="middle" style="fill:#5b4fd6;">hole "fix the call"</text><text x="214" y="165" font-size="10.5" class="muted" text-anchor="start">filled in run 1, seeing text</text><text x="58" y="192" font-size="11" class="mono" xml:space="preserve" text-anchor="start">edit { path = "lib/a.ml"</text><text x="58" y="210" font-size="11" class="mono" xml:space="preserve" text-anchor="start">     , old = "Foo.bar"</text><text x="58" y="228" font-size="11" class="mono" xml:space="preserve" text-anchor="start">     , new = "Foo.baz" }</text><text x="58" y="246" font-size="11" class="mono" xml:space="preserve" text-anchor="start">    |&gt; andThen (\_ -&gt;</text><rect x="78" y="256" width="336" height="60" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/><rect x="90" y="266" width="158" height="18" rx="9" fill="#ffffff" stroke="#5b4fd6" stroke-width="1.4" stroke-dasharray="5 4" class="pulse"/><text x="169" y="279" font-size="10.5" class="mono" xml:space="preserve" text-anchor="middle" style="fill:#5b4fd6;">hole "run the tests"</text><text x="256" y="279" font-size="10.5" class="muted" text-anchor="start">filled in run 2</text><text x="92" y="305" font-size="11" class="mono" xml:space="preserve" text-anchor="start">shell "dune test"</text><text x="26" y="344" font-size="11" class="muted" text-anchor="start">each inset is code the agent wrote where a hole was</text><rect x="452" y="40" width="418" height="318" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/><text x="468" y="64" font-size="12.5" font-weight="650" text-anchor="start">what runs, run by run</text><text x="712" y="92" font-size="11" class="muted" text-anchor="middle">run 1</text><text x="772" y="92" font-size="11" class="muted" text-anchor="middle">run 2</text><text x="832" y="92" font-size="11" class="muted" text-anchor="middle">run 3</text><text x="468" y="128" font-size="10.5" class="mono" xml:space="preserve" text-anchor="start">read "lib/a.ml"</text><rect x="685" y="114" width="54" height="20" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="712" y="128" font-size="10.5" font-weight="600" text-anchor="middle" style="fill:#1a7f37;">runs</text><rect x="745" y="114" width="54" height="20" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="772" y="128" font-size="10.5" font-weight="600" text-anchor="middle" style="fill:#59636e;">reused</text><rect x="805" y="114" width="54" height="20" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="832" y="128" font-size="10.5" font-weight="600" text-anchor="middle" style="fill:#59636e;">reused</text><text x="468" y="162" font-size="10.5" class="mono" xml:space="preserve" text-anchor="start" style="fill:#5b4fd6;">hole "fix the call"</text><rect x="685" y="148" width="54" height="20" rx="10" fill="#ece9ff" stroke="#5b4fd6" stroke-width="1.2" class="pulse"/><text x="712" y="162" font-size="10.5" font-weight="600" text-anchor="middle" style="fill:#5b4fd6;">asks</text><text x="772" y="162" font-size="10.5" class="muted" text-anchor="middle">filled</text><text x="832" y="162" font-size="10.5" class="muted" text-anchor="middle">filled</text><text x="468" y="196" font-size="10.5" class="mono" xml:space="preserve" text-anchor="start">edit lib/a.ml</text><rect x="745" y="182" width="54" height="20" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="772" y="196" font-size="10.5" font-weight="600" text-anchor="middle" style="fill:#1a7f37;">runs</text><rect x="805" y="182" width="54" height="20" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="832" y="196" font-size="10.5" font-weight="600" text-anchor="middle" style="fill:#59636e;">reused</text><text x="468" y="230" font-size="10.5" class="mono" xml:space="preserve" text-anchor="start" style="fill:#5b4fd6;">hole "run the tests"</text><rect x="745" y="216" width="54" height="20" rx="10" fill="#ece9ff" stroke="#5b4fd6" stroke-width="1.2" class="pulse"/><text x="772" y="230" font-size="10.5" font-weight="600" text-anchor="middle" style="fill:#5b4fd6;">asks</text><text x="832" y="230" font-size="10.5" class="muted" text-anchor="middle">filled</text><text x="468" y="264" font-size="10.5" class="mono" xml:space="preserve" text-anchor="start">shell "dune test"</text><rect x="805" y="250" width="54" height="20" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="832" y="264" font-size="10.5" font-weight="600" text-anchor="middle" style="fill:#1a7f37;">runs</text><line x1="468" y1="290" x2="854" y2="290" stroke="#d0d7de" stroke-width="1"/><text x="468" y="312" font-size="11" class="muted" text-anchor="start">each tool runs once: a rerun reuses what it returned</text><text x="468" y="330" font-size="11" class="muted" text-anchor="start">the agent is asked once per hole, with the values in scope</text><text x="468" y="348" font-size="11" class="muted" text-anchor="start">the code it writes