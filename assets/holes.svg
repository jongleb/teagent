<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img"><style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #59636e; }
    .accent { fill: #5b4fd6; }
    .flow { stroke-dasharray: 7 9; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style><text x="4" y="18" font-size="14.5" font-weight="650" text-anchor="start">A hole: the program stops where it needs data, and the agent writes that piece of it</text><rect x="10" y="50" width="200" height="150" rx="10" fill="#ece9ff" stroke="#5b4fd6" stroke-width="1.4"/><text x="110" y="76" font-size="14" font-weight="650" text-anchor="middle">program</text><text x="26" y="108" font-size="11" class="mono" xml:space="preserve" text-anchor="start">read "lib/a.ml"</text><text x="26" y="128" font-size="11" class="mono" xml:space="preserve" text-anchor="start">  |&gt; andThen (\text -&gt;</text><text x="26" y="148" font-size="11" class="mono" xml:space="preserve" text-anchor="start" style="fill:#5b4fd6">      hole "fix it")</text><text x="110" y="186" font-size="11" class="muted" text-anchor="middle">it typechecks with the hole</text><line x1="214" y1="125" x2="250" y2="125" stroke="#59636e" stroke-width="1.8" class="flow"/><polygon points="250,125 243.7,128 243.7,122" fill="#59636e"/><text x="232.0" y="114" font-size="11" class="muted" text-anchor="middle">stops</text><rect x="254" y="50" width="190" height="150" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/><text x="349" y="76" font-size="14" font-weight="650" text-anchor="middle">the agent</text><text x="349" y="102" font-size="11.5" class="muted" text-anchor="middle">the same model, same talk,</text><text x="349" y="120" font-size="11.5" class="muted" text-anchor="middle">or whoever called run: fill</text><text x="349" y="150" font-size="11" class="mono" xml:space="preserve" text-anchor="middle">text = "let x = …"</text><text x="349" y="172" font-size="11.5" class="muted" text-anchor="middle">sees the values in scope</text><line x1="448" y1="125" x2="484" y2="125" stroke="#59636e" stroke-width="1.8" class="flow"/><polygon points="484,125 477.7,128 477.7,122" fill="#59636e"/><text x="466.0" y="114" font-size="11" class="muted" text-anchor="middle">code</text><rect x="488" y="50" width="180" height="150" rx="10" fill="#fff4d6" stroke="#9a6700" stroke-width="1.4"/><text x="578" y="76" font-size="14" font-weight="650" text-anchor="middle">typecheck in place</text><text x="578" y="104" font-size="11.5" class="muted" text-anchor="middle">the code goes where</text><text x="578" y="122" font-size="11.5" class="muted" text-anchor="middle">the hole was, so it gets</text><text x="578" y="140" font-size="11.5" class="muted" text-anchor="middle">the hole's type</text><text x="578" y="172" font-size="11.5" class="muted" text-anchor="middle">errors go back, up to 4</text><line x1="672" y1="125" x2="708" y2="125" stroke="#59636e" stroke-width="1.8" class="flow"/><polygon points="708,125 701.7,128 701.7,122" fill="#59636e"/><text x="690.0" y="114" font-size="11" class="muted" text-anchor="middle">again</text><rect x="712" y="50" width="158" height="150" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/><text x="791" y="76" font-size="14" font-weight="650" text-anchor="middle">rerun</text><text x="791" y="104" font-size="11.5" class="muted" text-anchor="middle">tools that ran answer</text><text x="791" y="122" font-size="11.5" class="muted" text-anchor="middle">from what they returned</text><text x="791" y="158" font-size="12" text-anchor="middle" style="fill:#1a7f37">nothing runs twice</text><path d="M 791 204 L 791 246 L 110 246 L 110 210" fill="none" stroke="#5b4fd6" stroke-width="1.8" class="flow"/><polygon points="110,204 107,210.3 113,210.3" fill="#5b4fd6"/><text x="450" y="268" font-size="12" font-weight="600" class="accent" text-anchor="middle">the new code may hold holes of its own: a matryoshka</text></svg>