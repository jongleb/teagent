<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img"><style>
text { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; fill: #e8ecef; }
.muted { fill: #7f8790; }
.dim { fill: #4b5158; }
.red { fill: #ff3d3d; }
.amber { fill: #ffb21e; }
.green { fill: #34e089; }
.cyan { fill: #5cc8ff; }
.flow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -28; } }
.blink { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .flow, .blink { animation: none; } }
</style><rect x="0.5" y="0.5" width="879" height="499" rx="12" fill="#050607" stroke="#1b1e22" stroke-width="1"/><line x1="0" y1="34" x2="880" y2="34" stroke="#16191c"/><circle cx="18" cy="17" r="3.5" fill="#ff3d3d" class="blink"/><text x="30" y="21" font-size="10" font-weight="600" text-anchor="start" xml:space="preserve" letter-spacing="2" class="muted">TEAGENT // FILE 09 · MAP</text><text x="864" y="21" font-size="10" font-weight="700" text-anchor="end" xml:space="preserve" letter-spacing="2.5" class="red">RESTRICTED</text><text x="18" y="60" font-size="13.5" font-weight="650" text-anchor="start" xml:space="preserve">Who does what, and who hands what to whom</text><rect x="16" y="76" width="230" height="66" rx="6" fill="#0c0e10" stroke="#e8ecef" stroke-width="1.2"/><text style="fill:#e8ecef" x="28" y="96" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve">PERSON</text><text x="236" y="96" font-size="9.5" font-weight="600" text-anchor="end" xml:space="preserve" class="dim">you</text><text x="28" y="116" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">the task; yes or no;</text><text x="28" y="132" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">rules.elm and the profile</text><rect x="325" y="76" width="230" height="66" rx="6" fill="#0c0e10" stroke="#e8ecef" stroke-width="1.2"/><text style="fill:#e8ecef" x="337" y="96" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve">MODEL</text><text x="545" y="96" font-size="9.5" font-weight="600" text-anchor="end" xml:space="preserve" class="dim">lib/llm</text><text x="337" y="116" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">writes each program and</text><text x="337" y="132" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">the code for each hole</text><rect x="634" y="76" width="230" height="66" rx="6" fill="#0c0e10" stroke="#e8ecef" stroke-width="1.2"/><text style="fill:#e8ecef" x="646" y="96" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve">OTHER AGENT</text><text x="854" y="96" font-size="9.5" font-weight="600" text-anchor="end" xml:space="preserve" class="dim">Claude Code, Codex</text><text x="646" y="116" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">sends whole programs,</text><text x="646" y="132" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">or single tools</text><rect x="16" y="176" width="560" height="66" rx="6" fill="#0c0e10" stroke="#5cc8ff" stroke-width="1.2"/><text style="fill:#5cc8ff" x="28" y="196" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve">SESSION LOOP</text><text x="566" y="196" font-size="9.5" font-weight="600" text-anchor="end" xml:space="preserve" class="dim">lib/driver</text><text x="28" y="216" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">asks the model, compiles, runs, settles the diff, keeps the log;</text><text x="28" y="232" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">the same loop replays a log, or resumes from it</text><rect x="600" y="176" width="264" height="66" rx="6" fill="#0c0e10" stroke="#5cc8ff" stroke-width="1.2"/><text style="fill:#5cc8ff" x="612" y="196" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve">MCP SERVER</text><text x="854" y="196" font-size="9.5" font-weight="600" text-anchor="end" xml:space="preserve" class="dim">lib/mcp</text><text x="612" y="216" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">run, fill and the tools,</text><text x="612" y="232" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">with no person to ask</text><rect x="16" y="276" width="200" height="66" rx="6" fill="#0c0e10" stroke="#ffb21e" stroke-width="1.2"/><text style="fill:#ffb21e" x="28" y="296" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve">OS VALUE</text><text x="206" y="296" font-size="9.5" font-weight="600" text-anchor="end" xml:space="preserve" class="dim">lib/os</text><text x="28" y="316" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">calls, mounts, hosts, limits,</text><text x="28" y="332" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">boot order, rules; image</text><rect x="232" y="276" width="200" height="66" rx="6" fill="#0c0e10" stroke="#5cc8ff" stroke-width="1.2"/><text style="fill:#5cc8ff" x="244" y="296" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve">COMPILER</text><text x="422" y="296" font-size="9.5" font-weight="600" text-anchor="end" xml:space="preserve" class="dim">lib/lang</text><text x="244" y="316" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">Dartea → IR, cut to the OS;</text><text x="244" y="332" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">the calls it can reach</text><rect x="448" y="276" width="200" height="66" rx="6" fill="#0c0e10" stroke="#5cc8ff" stroke-width="1.2"/><text style="fill:#5cc8ff" x="460" y="296" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve">INTERPRETER</text><text x="638" y="296" font-size="9.5" font-weight="600" text-anchor="end" xml:space="preserve" class="dim">lib/interp</text><text x="460" y="316" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">IR → a tree of effects;</text><text x="460" y="332" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">every value labelled</text><rect x="664" y="276" width="200" height="66" rx="6" fill="#0c0e10" stroke="#5cc8ff" stroke-width="1.2"/><text style="fill:#5cc8ff" x="676" y="296" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve">RUN</text><text x="854" y="296" font-size="9.5" font-weight="600" text-anchor="end" xml:space="preserve" class="dim">lib/run</text><text x="676" y="316" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">one program; holes and</text><text x="676" y="332" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">their fills, no repeats</text><rect x="16" y="380" width="416" height="66" rx="6" fill="#0c0e10" stroke="#ff3d3d" stroke-width="1.2"/><text style="fill:#ff3d3d" x="28" y="400" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve">HANDLER</text><text x="422" y="400" font-size="9.5" font-weight="600" text-anchor="end" xml:space="preserve" class="dim">lib/effect</text><text x="28" y="420" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">boot layers: budget → journal → policy (rules, labels,</text><text x="28" y="436" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">consent); the staged overlay and its diff</text><rect x="448" y="380" width="416" height="66" rx="6" fill="#0c0e10" stroke="#ff3d3d" stroke-width="1.2"/><text style="fill:#ff3d3d" x="460" y="400" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve">TOOLS</text><text x="854" y="400" font-size="9.5" font-weight="600" text-anchor="end" xml:space="preserve" class="dim">lib/tools · lib/device</text><text x="460" y="420" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">the only IO: files, search, the sandbox, the proxy,</text><text x="460" y="436" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">limits, redaction, the commit; drivers such as Fetch</text><line x1="131" y1="140" x2="131" y2="176" stroke="#4b5158" stroke-width="1.4" class="flow"/><path d="M131,176 l-7,-4 v8 z" fill="#4b5158" transform="rotate(90.0 131 176)"/><line x1="430" y1="140" x2="430" y2="176" stroke="#4b5158" stroke-width="1.4" class="flow"/><path d="M430,176 l-7,-4 v8 z" fill="#4b5158" transform="rotate(90.0 430 176)"/><line x1="450" y1="176" x2="450" y2="140" stroke="#4b5158" stroke-width="1.4" class="flow"/><path d="M450,140 l-7,-4 v8 z" fill="#4b5158" transform="rotate(-90.0 450 140)"/><line x1="749" y1="140" x2="749" y2="176" stroke="#4b5158" stroke-width="1.4" class="flow"/><path d="M749,176 l-7,-4 v8 z" fill="#4b5158" transform="rotate(90.0 749 176)"/><line x1="332" y1="238" x2="332" y2="276" stroke="#4b5158" stroke-width="1.4" class="flow"/><path d="M332,276 l-7,-4 v8 z" fill="#4b5158" transform="rotate(90.0 332 276)"/><line x1="540" y1="238" x2="700" y2="276" stroke="#4b5158" stroke-width="1.4" class="flow"/><path d="M700,276 l-7,-4 v8 z" fill="#4b5158" transform="rotate(13.36 700 276)"/><line x1="764" y1="238" x2="764" y2="276" stroke="#4b5158" stroke-width="1.4" class="flow"/><path d="M764,276 l-7,-4 v8 z" fill="#4b5158" transform="rotate(90.0 764 276)"/><line x1="216" y1="308" x2="232" y2="308" stroke="#ffb21e" stroke-width="1.4"/><path d="M232,308 l-7,-4 v8 z" fill="#ffb21e" transform="rotate(0.0 232 308)"/><line x1="664" y1="308" x2="648" y2="308" stroke="#4b5158" stroke-width="1.4"/><path d="M648,308 l-7,-4 v8 z" fill="#4b5158" transform="rotate(180.0 648 308)"/><line x1="116" y1="340" x2="116" y2="380" stroke="#ffb21e" stroke-width="1.4" class="flow"/><path d="M116,380 l-7,-4 v8 z" fill="#ffb21e" transform="rotate(90.0 116 380)"/><line x1="548" y1="340" x2="330" y2="380" stroke="#4b5158" stroke-width="1.4" class="flow"/><path d="M330,380 l-7,-4 v8 z" fill="#4b5158" transform="rotate(169.6 330 380)"/><line x1="432" y1="412" x2="448" y2="412" stroke="#ff3d3d" stroke-width="1.4" class="flow"/><path d="M448,412 l-7,-4 v8 z" fill="#ff3d3d" transform="rotate(0.0 448 412)"/><text x="16" y="482" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">arrows show who hands what to whom. only TOOLS touches your disk or the network.</text></svg>