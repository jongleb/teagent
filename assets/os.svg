<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 422" width="880" height="422" role="img"><style>
text { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; fill: #e8ecef; }
.muted { fill: #7f8790; }
.dim { fill: #4b5158; }
.red { fill: #ff3d3d; }
.amber { fill: #ffb21e; }
.green { fill: #34e089; }
.cyan { fill: #5cc8ff; }
.flow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -28; } }
.blink { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .flow, .blink { animation: none; } }
</style><rect x="0.5" y="0.5" width="879" height="421" rx="12" fill="#050607" stroke="#1b1e22" stroke-width="1"/><line x1="0" y1="34" x2="880" y2="34" stroke="#16191c"/><circle cx="18" cy="17" r="3.5" fill="#ff3d3d" class="blink"/><text x="30" y="21" font-size="10" font-weight="600" text-anchor="start" xml:space="preserve" letter-spacing="2" class="muted">TEAGENT // FILE 05 · MICRO-OS</text><text x="864" y="21" font-size="10" font-weight="700" text-anchor="end" xml:space="preserve" letter-spacing="2.5" class="red">RESTRICTED</text><text x="18" y="60" font-size="13.5" font-weight="650" text-anchor="start" xml:space="preserve">teagent as a small operating system</text><rect x="16" y="76" width="640" height="44" rx="6" fill="#0c0e10" stroke="#24282d" stroke-width="1.2"/><text style="fill:#e8ecef" x="30" y="103" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve">PROGRAM</text><text x="156" y="103" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">Main.elm, written by the model; it can only ask</text><text x="680" y="103" font-size="10" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="1.5" class="dim">YOUR CODE</text><line x1="656" y1="98" x2="672" y2="98" stroke="#4b5158" stroke-dasharray="2 3"/><rect x="16" y="128" width="640" height="44" rx="6" fill="#0c0e10" stroke="#5cc8ff" stroke-width="1.2"/><text style="fill:#5cc8ff" x="30" y="155" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve">CALLS</text><text x="156" y="155" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">Agent and drivers, cut to the OS before compiling</text><text x="680" y="155" font-size="10" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="1.5" class="dim">SYSCALL TABLE</text><line x1="656" y1="150" x2="672" y2="150" stroke="#4b5158" stroke-dasharray="2 3"/><rect x="16" y="180" width="640" height="44" rx="6" fill="#0c0e10" stroke="#5cc8ff" stroke-width="1.2"/><text style="fill:#5cc8ff" x="30" y="207" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve">PROCESSES</text><text x="156" y="207" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">spawn narrows the view; merge joins it back</text><text x="680" y="207" font-size="10" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="1.5" class="dim">FORK · JOIN</text><line x1="656" y1="202" x2="672" y2="202" stroke="#4b5158" stroke-dasharray="2 3"/><rect x="16" y="232" width="640" height="44" rx="6" fill="#0c0e10" stroke="#ffb21e" stroke-width="1.2"/><text style="fill:#ffb21e" x="30" y="259" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve">FILES</text><text x="156" y="259" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">hidden · readonly · scratch · staged; .env hidden; tooling denied</text><text x="680" y="259" font-size="10" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="1.5" class="dim">MOUNT TABLE</text><line x1="656" y1="254" x2="672" y2="254" stroke="#4b5158" stroke-dasharray="2 3"/><rect x="16" y="284" width="640" height="44" rx="6" fill="#0c0e10" stroke="#ff3d3d" stroke-width="1.2"/><text style="fill:#ff3d3d" x="30" y="311" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve">BOOT LAYERS</text><text x="156" y="311" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">budget → journal → policy (rules, labels, consent)</text><text x="680" y="311" font-size="10" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="1.5" class="dim">KERNEL MODULES</text><line x1="656" y1="306" x2="672" y2="306" stroke="#4b5158" stroke-dasharray="2 3"/><rect x="16" y="336" width="640" height="44" rx="6" fill="#0c0e10" stroke="#34e089" stroke-width="1.2"/><text style="fill:#34e089" x="30" y="363" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve">OUTSIDE</text><text x="156" y="363" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">held files, Egress asks, --net proxy, commit</text><text x="680" y="363" font-size="10" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="1.5" class="dim">FIREWALL</text><line x1="656" y1="358" x2="672" y2="358" stroke="#4b5158" stroke-dasharray="2 3"/><text x="16" y="404" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">an OS value only narrows: every right comes from granted, the profile can only take some away.</text></svg>