<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" width="880" height="384" role="img"><style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #59636e; }
    .accent { fill: #5b4fd6; }
    .flow { stroke-dasharray: 7 9; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.45; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
    </style><text x="4" y="18" font-size="14.5" font-weight="650" text-anchor="start">teagent as a small OS: the layers of a real one, each a value that is checked before anything runs</text><rect x="10" y="44" width="580" height="60" rx="10" fill="#ece9ff" stroke="#5b4fd6" stroke-width="1.4"/><text x="24" y="68" font-size="13" font-weight="650" text-anchor="start">your program</text><text x="24" y="85" font-size="10.5" class="muted" text-anchor="start">Main.elm, written by the model;</text><text x="24" y="99" font-size="10.5" class="muted" text-anchor="start">it can only ask</text><rect x="10" y="112" width="580" height="60" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/><text x="24" y="136" font-size="13" font-weight="650" text-anchor="start">system calls</text><text x="24" y="153" font-size="10.5" class="muted" text-anchor="start">the profile cuts this list</text><text x="24" y="167" font-size="10.5" class="muted" text-anchor="start">before it compiles</text><rect x="10" y="180" width="580" height="60" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/><text x="24" y="204" font-size="13" font-weight="650" text-anchor="start">processes</text><text x="24" y="221" font-size="10.5" class="muted" text-anchor="start">spawn copies the view,</text><text x="24" y="235" font-size="10.5" class="muted" text-anchor="start">merge joins it back</text><rect x="10" y="248" width="580" height="60" rx="10" fill="#fff4d6" stroke="#9a6700" stroke-width="1.4"/><text x="24" y="272" font-size="13" font-weight="650" text-anchor="start">file system</text><text x="24" y="289" font-size="10.5" class="muted" text-anchor="start">each path has a kind</text><rect x="10" y="316" width="580" height="60" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/><text x="24" y="340" font-size="13" font-weight="650" text-anchor="start">the outside</text><text x="24" y="357" font-size="10.5" class="muted" text-anchor="start">reached only through</text><text x="24" y="371" font-size="10.5" class="muted" text-anchor="start">the layers above</text><text x="206" y="70" font-size="11" class="mono" xml:space="preserve" text-anchor="start">spawn [ Hidden "secrets" ] tryFix</text><text x="206" y="88" font-size="11" class="mono" xml:space="preserve" text-anchor="start">    |&gt; andThen merge</text><rect x="206" y="120" width="39.6" height="19" rx="9" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="225.8" y="133.5" font-size="10.5" class="mono" xml:space="preserve" text-anchor="middle">read</text><rect x="251.6" y="120" width="46.0" height="19" rx="9" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="274.6" y="133.5" font-size="10.5" class="mono" xml:space="preserve" text-anchor="middle">write</text><rect x="303.6" y="120" width="39.6" height="19" rx="9" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="323.40000000000003" y="133.5" font-size="10.5" class="mono" xml:space="preserve" text-anchor="middle">edit</text><rect x="349.20000000000005" y="120" width="39.6" height="19" rx="9" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="369.00000000000006" y="133.5" font-size="10.5" class="mono" xml:space="preserve" text-anchor="middle">grep</text><rect x="394.80000000000007" y="120" width="46.0" height="19" rx="9" fill="#ffffff" stroke="#cf222e" stroke-width="1.2"/><text x="417.80000000000007" y="133.5" font-size="10.5" class="mono" xml:space="preserve" text-anchor="middle" style="fill:#cf222e;text-decoration:line-through;">shell</text><rect x="206" y="146" width="39.6" height="19" rx="9" fill="#ffffff" stroke="#5b4fd6" stroke-width="1.2"/><text x="225.8" y="159.5" font-size="10.5" class="mono" xml:space="preserve" text-anchor="middle" style="fill:#5b4fd6;">hole</text><rect x="251.6" y="146" width="46.0" height="19" rx="9" fill="#ffffff" stroke="#5b4fd6" stroke-width="1.2"/><text x="274.6" y="159.5" font-size="10.5" class="mono" xml:space="preserve" text-anchor="middle" style="fill:#5b4fd6;">spawn</text><rect x="303.6" y="146" width="46.0" height="19" rx="9" fill="#ffffff" stroke="#5b4fd6" stroke-width="1.2"/><text x="326.6" y="159.5" font-size="10.5" class="mono" xml:space="preserve" text-anchor="middle" style="fill:#5b4fd6;">merge</text><rect x="355.6" y="146" width="71.6" height="19" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.2"/><text x="391.40000000000003" y="159.5" font-size="10.5" class="mono" xml:space="preserve" text-anchor="middle" style="fill:#0969da;">Fetch.get</text><text x="437.20000000000005" y="159.5" font-size="10.5" class="muted" text-anchor="start">a driver</text><text x="456" y="128" font-size="10.5" text-anchor="start" style="fill:#cf222e;">no bash in the profile,</text><text x="456" y="141" font-size="10.5" class="muted" text-anchor="start">so shell will not compile</text><rect x="206" y="189" width="120" height="42" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"/><text x="266" y="206" font-size="11.5" font-weight="650" text-anchor="middle">main</text><text x="266" y="222" font-size="10" class="muted" text-anchor="middle">its staged changes</text><rect x="426" y="189" width="156" height="42" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.4" stroke-dasharray="5 4"/><text x="504" y="206" font-size="11.5" font-weight="650" text-anchor="middle">child</text><text x="504" y="222" font-size="10" class="muted" text-anchor="middle">cannot see secrets/</text><line x1="330" y1="201" x2="422" y2="201" stroke="#59636e" stroke-width="1.6" class="flow"/><polygon points="422,201 415.7,198 415.7,204" fill="#59636e"/><line x1="422" y1="221" x2="330" y2="221" stroke="#5b4fd6" stroke-width="1.6" class="flow"/><polygon points="330,221 336.3,218 336.3,224" fill="#5b4fd6"/><text x="376" y="196" font-size="10" class="muted" text-anchor="middle">spawn</text><text x="376" y="235" font-size="10" class="accent" text-anchor="middle">merge</text><rect x="206" y="256" width="88" height="44" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="1.2"/><text x="250" y="273" font-size="10.5" class="mono" xml:space="preserve" text-anchor="middle">secrets/</text><text x="250" y="291" font-size="10.5" font-weight="650" text-anchor="middle" style="fill:#cf222e;">hidden</text><rect x="302" y="256" width="88" height="44" rx="8" fill="#ffffff" stroke="#9a6700" stroke-width="1.2"/><text x="346" y="273" font-size="10.5" class="mono" xml:space="preserve" text-anchor="middle">vendor/</text><text x="346" y="291" font-size="10.5" font-weight="650" text-anchor="middle" style="fill:#9a6700;">readonly</text><rect x="398" y="256" width="88" height="44" rx="8" fill="#ffffff" stroke="#5b4fd6" stroke-width="1.2"/><text x="442" y="273" font-size="10.5" class="mono" xml:space="preserve" text-anchor="middle">_build/</text><text x="442" y="291" font-size="10.5" font-weight="650" text-anchor="middle" style="fill:#5b4fd6;">scratch</text><rect x="494" y="256" width="88" height="44" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2"/><text x="538" y="273" font-size="10.5" class="mono" xml:space="preserve" text-anchor="middle">the rest</text><text x="538" y="291" font-size="10.5" font-weight="650" text-anchor="middle" style="fill:#1a7f37;">staged</text><rect x="206" y="325" width="182" height="42" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2"/><text x="297" y="342" font-size="11.5" font-weight="650" text-anchor="middle">disk</text><text x="297" y="358" font-size="10" class="muted" text-anchor="middle">only changes you approve</text><rect x="398" y="325" width="184" height="42" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2"/><text x="490" y="342" font-size="11.5" font-weight="650" text-anchor="middle">network</text><text x="490" y="358" font-size="10" class="muted" text-anchor="middle">only hosts given with --net</text><text x="612" y="36" font-size="11" font-weight="650" class="muted" text-anchor="start">in OS terms</text><line x1="592" y1="74" x2="606" y2="74" stroke="#d0d7de" stroke-width="1.4"/><text x="612" y="70" font-size="12" font-weight="650" text-anchor="start">user program</text><text x="612" y="87" font-size="10.5" class="muted" text-anchor="start">a process's code</text><line x1="592" y1="142" x2="606" y2="142" stroke="#d0d7de" stroke-width="1.4"/><text x="612" y="138" font-size="12" font-weight="650" text-anchor="start">syscall table</text><text x="612" y="155" font-size="10.5" class="muted" text-anchor="start">like seccomp, checked at compile</text><line x1="592" y1="210" x2="606" y2="210" stroke="#d0d7de" stroke-width="1.4"/><text x="612" y="206" font-size="12" font-weight="650" text-anchor="start">fork and join</text><text x="612" y="223" font-size="10.5" class="muted" text-anchor="start">copy-on-write, like a container layer</text><line x1="592" y1="278" x2="606" y2="278" stroke="#d0d7de" stroke-width="1.4"/><text x="612" y="274" font-size="12" font-weight="650" text-anchor="start">mount table</text><text x="612" y="291" font-size="10.5" class="muted" text-anchor="start">like bind mounts: none, ro, tmpfs</text><line x1="592" y1="346" x2="606" y2="346" stroke="#d0d7de" stroke-width="1.4"/><text x="612" y="342" font-size="12" font-weight="650" text-anchor="start">devices, firewall</text><text x="612" y="359" font-size="10.5" class="muted" text-anchor="start">disk writes and egress rules</text></svg>