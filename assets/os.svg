    </style><text x="4" y="18" font-size="14.5" font-weight="650" text-anchor="start">A micro-OS per task: the profile decides what a program can name, and a child can only see less</text><rect x="10" y="50" width="160" height="240" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/><text x="90" y="76" font-size="14" font-weight="650" text-anchor="middle">profile</text><text x="24" y="110" font-size="11" class="mono" xml:space="preserve" text-anchor="start">"tools": […]</text><text x="24" y="132" font-size="11" class="mono" xml:space="preserve" text-anchor="start">"mounts": {…}</text><text x="24" y="154" font-size="11" class="mono" xml:space="preserve" text-anchor="start">--net example.com</text><text x="90" y="206" font-size="11.5" class="muted" text-anchor="middle">it can only take</text><text x="90" y="224" font-size="11.5" class="muted" text-anchor="middle">rights away; only</text><text x="90" y="242" font-size="11.5" class="muted" text-anchor="middle">--net grants hosts</text><line x1="174" y1="170" x2="210" y2="170" stroke="#59636e" stroke-width="1.8" class="flow"/><polygon points="210,170 203.7,173 203.7,167" fill="#59636e"/><text x="192.0" y="159" font-size="11" class="muted" text-anchor="middle">cuts</text><rect x="214" y="50" width="190" height="240" rx="10" fill="#ece9ff" stroke="#5b4fd6" stroke-width="1.4"/><text x="309" y="76" font-size="14" font-weight="650" text-anchor="middle">what a program</text><text x="309" y="94" font-size="14" font-weight="650" text-anchor="middle">can name</text><text x="228" y="124" font-size="11.5" font-weight="650" text-anchor="start">Agent</text><text x="228" y="144" font-size="11" class="mono" xml:space="preserve" text-anchor="start">read write edit grep</text><text x="228" y="162" font-size="11" class="mono" xml:space="preserve" text-anchor="start">shell hole spawn merge</text><text x="228" y="194" font-size="11.5" font-weight="650" text-anchor="start">Fetch  (a driver)</text><text x="228" y="212" font-size="11" class="mono" xml:space="preserve" text-anchor="start">get</text><text x="309" y="252" font-size="11.5" class="muted" text-anchor="middle">a call left out</text><text x="309" y="270" font-size="11.5" class="muted" text-anchor="middle">does not compile</text><line x1="408" y1="170" x2="444" y2="170" stroke="#59636e" stroke-width="1.8" class="flow"/><polygon points="444,170 437.7,173 437.7,167" fill="#59636e"/><text x="426.0" y="159" font-size="11" class="muted" text-anchor="middle">runs</text><rect x="448" y="50" width="220" height="240" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/><text x="558" y="76" font-size="14" font-weight="650" text-anchor="middle">processes</text><rect x="462" y="92" width="192" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/><text x="558" y="113" font-size="12.5" font-weight="650" text-anchor="middle">main</text><text x="558" y="131" font-size="11" class="muted" text-anchor="middle">its staged changes</text><rect x="462" y="172" width="192" height="70" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.4" stroke-dasharray="6 5"/><text x="558" y="192" font-size="12.5" font-weight="650" text-anchor="middle">child</text><text x="558" y="210" font-size="10" class="mono" xml:space="preserve" text-anchor="middle">spawn [ Hidden "secrets" ]</text><text x="558" y="228" font-size="11" class="muted" text-anchor="middle">a copy, seeing less</text><line x1="520" y1="148" x2="520" y2="166" stroke="#59636e" stroke-width="1.6"/><polygon points="520,170 517,163.7 523,163.7" fill="#59636e"/><line x1="600" y1="166" x2="600" y2="148" stroke="#5b4fd6" stroke-width="1.6"/><polygon points="600,144 597,150.3 603,150.3" fill="#5b4fd6"/><text x="516" y="161" font-size="10.5" class="muted" text-anchor="end">spawn</text><text x="604" y="161" font-size="10.5" class="accent" text-anchor="start">merge</text><text x="558" y="266" font-size="11" class="muted" text-anchor="middle">merge takes only what</text><text x="558" y="282" font-size="11" class="muted" text-anchor="middle">nobody moved meanwhile</text><line x1="672" y1="170" x2="708" y2="170" stroke="#59636e" stroke-width="1.8" class="flow"/><polygon points="708,170 701.7,173 701.7,167" fill="#59636e"/><text x="690.0" y="159" font-size="11" class="muted" text-anchor="middle">sees</text><rect x="712" y="50" width="158" height="240" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/><text x="791" y="76" font-size="14" font-weight="650" text-anchor="middle">workspace</text><text x="726" y="110" font-size="11" class="mono" xml:space="preserve" text-anchor="start">secrets/</text><text x="856" y="110" font-size="11.5" font-weight="650" text-anchor="end" style="fill:#cf222e">hidden</text><text x="726" y="144" font-size="11" class="mono" xml:space="preserve" text-anchor="start">vendor/</text><text x="856" y="144" font-size="11.5" font-weight="650" text-anchor="end" style="fill:#9a6700">readonly</text><text x="726" y="178" font-size="11" class="mono" xml:space="preserve" text-anchor="start">_build/</text><text x="856" y="178" font-size="11.5" font-weight="650" text-anchor="end" style="fill:#5b4fd6">scratch</text><text x="726" y="212" font-size="11" class="mono" xml:space="preserve" text-anchor="start">the rest</text><text x="856" y="212" font-size="11.5" font-weight="650" text-anchor="end" style="fill:#1a7f37">staged</text><text x="791" y="252" font-size="11.5" class="muted" text-anchor="middle">only staged changes</text><text x="791" y="270" font-size="11.5" class="muted" text-anchor="middle">reach the disk</text></svg>