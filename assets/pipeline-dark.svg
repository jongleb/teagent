<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 276" width="880" height="276" role="img"><style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #9198a1; }
    .accent { fill: #a5a0ff; }
    .flow { stroke-dasharray: 7 9; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style><text x="4" y="18" font-size="14.5" font-weight="650">One step of a session</text><rect x="4" y="44" width="128" height="84" rx="10" fill="#102339" stroke="#4493f8" stroke-width="1.4"/><text x="68.0" y="72" font-size="14" font-weight="650" text-anchor="middle">Model</text><text x="68.0" y="94" font-size="11.5" class="muted" text-anchor="middle">writes one Dartea</text><text x="68.0" y="110" font-size="11.5" class="muted" text-anchor="middle">program</text><line x1="134" y1="86.0" x2="150" y2="86.0" stroke="#9198a1" stroke-width="1.8" class="flow"/><polygon points="150,86.0 143.7,89.0 143.7,83.0" fill="#9198a1"/><rect x="153" y="44" width="128" height="84" rx="10" fill="#262350" stroke="#a5a0ff" stroke-width="1.4"/><text x="217.0" y="72" font-size="14" font-weight="650" text-anchor="middle">Typecheck</text><text x="217.0" y="94" font-size="11.5" class="muted" text-anchor="middle">Elm-style report</text><text x="217.0" y="110" font-size="11.5" class="muted" text-anchor="middle">with hints</text><line x1="283" y1="86.0" x2="299" y2="86.0" stroke="#9198a1" stroke-width="1.8" class="flow"/><polygon points="299,86.0 292.7,89.0 292.7,83.0" fill="#9198a1"/><rect x="302" y="44" width="128" height="84" rx="10" fill="#262350" stroke="#a5a0ff" stroke-width="1.4"/><text x="366.0" y="72" font-size="14" font-weight="650" text-anchor="middle">Interpreter</text><text x="366.0" y="94" font-size="11.5" class="muted" text-anchor="middle">IR to a tree of</text><text x="366.0" y="110" font-size="11.5" class="muted" text-anchor="middle">effects, no IO</text><line x1="432" y1="86.0" x2="448" y2="86.0" stroke="#9198a1" stroke-width="1.8" class="flow"/><polygon points="448,86.0 441.7,89.0 441.7,83.0" fill="#9198a1"/><rect x="451" y="44" width="128" height="84" rx="10" fill="#2e2410" stroke="#d29922" stroke-width="1.4"/><text x="515.0" y="72" font-size="14" font-weight="650" text-anchor="middle">Handler</text><text x="515.0" y="94" font-size="11.5" class="muted" text-anchor="middle">edits staged,</text><text x="515.0" y="110" font-size="11.5" class="muted" text-anchor="middle">shell contained</text><line x1="581" y1="86.0" x2="597" y2="86.0" stroke="#9198a1" stroke-width="1.8" class="flow"/><polygon points="597,86.0 590.7,89.0 590.7,83.0" fill="#9198a1"/><rect x="600" y="44" width="128" height="84" rx="10" fill="#2e2410" stroke="#d29922" stroke-width="1.4"/><text x="664.0" y="72" font-size="14" font-weight="650" text-anchor="middle">Diff</text><text x="664.0" y="94" font-size="11.5" class="muted" text-anchor="middle">every change</text><text x="664.0" y="110" font-size="11.5" class="muted" text-anchor="middle">shown first</text><line x1="730" y1="86.0" x2="746" y2="86.0" stroke="#9198a1" stroke-width="1.8" class="flow"/><polygon points="746,86.0 739.7,89.0 739.7,83.0" fill="#9198a1"/><rect x="749" y="44" width="128" height="84" rx="10" fill="#12261a" stroke="#3fb950" stroke-width="1.4"/><text x="813.0" y="72" font-size="14" font-weight="650" text-anchor="middle">Commit</text><text x="813.0" y="94" font-size="11.5" class="muted" text-anchor="middle">all or nothing,</text><text x="813.0" y="110" font-size="11.5" class="muted" text-anchor="middle">or discard</text><path d="M 217.0 130 C 217.0 164, 68.0 164, 68.0 134" fill="none" stroke="#a5a0ff" stroke-width="1.6" class="flow"/><polygon points="68.0,134 71.0,140.3 65.0,140.3" fill="#a5a0ff"/><text x="287.0" y="158" font-size="11.5" class="muted">compile error goes back, up to 4 rounds</text><path d="M 813.0 130 C 813.0 248, 46.0 248, 46.0 134" fill="none" stroke="#3fb950" stroke-width="1.6" class="flow"/><polygon points="46.0,134 49.0,140.3 43.0,140.3" fill="#3fb950"/><text x="440" y="256" font-size="11.5" class="muted" text-anchor="middle">the value of main goes back; the model writes the next program or answers</text></svg>