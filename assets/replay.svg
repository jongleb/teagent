<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 232" width="880" height="232" role="img"><style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #59636e; }
    .accent { fill: #5b4fd6; }
    .flow { stroke-dasharray: 7 9; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style><text x="4" y="18" font-size="14.5" font-weight="650">Every session is a log of what the world answered</text><line x1="20" y1="70" x2="860" y2="70" stroke="#d0d7de" stroke-width="2"/><circle cx="20.0" cy="70" r="7" fill="#0969da"/><text x="20.0" y="96" font-size="11" font-weight="mono" text-anchor="middle">wrote</text><circle cx="102.0" cy="70" r="7" fill="#5b4fd6"/><text x="102.0" y="110" font-size="11" font-weight="mono" text-anchor="middle">refused</text><circle cx="184.0" cy="70" r="7" fill="#0969da"/><text x="184.0" y="96" font-size="11" font-weight="mono" text-anchor="middle">wrote</text><circle cx="266.0" cy="70" r="7" fill="#9a6700"/><text x="266.0" y="110" font-size="11" font-weight="mono" text-anchor="middle">performed</text><circle cx="348.0" cy="70" r="7" fill="#9a6700"/><text x="348.0" y="96" font-size="11" font-weight="mono" text-anchor="middle">deferred</text><circle cx="430.0" cy="70" r="7" fill="#9a6700"/><text x="430.0" y="110" font-size="11" font-weight="mono" text-anchor="middle">staged</text><circle cx="512.0" cy="70" r="7" fill="#1a7f37"/><text x="512.0" y="96" font-size="11" font-weight="mono" text-anchor="middle">decided</text><circle cx="594.0" cy="70" r="7" fill="#1a7f37"/><text x="594.0" y="110" font-size="11" font-weight="mono" text-anchor="middle">committed</text><circle cx="676.0" cy="70" r="7" fill="#9a6700"/><text x="676.0" y="96" font-size="11" font-weight="mono" text-anchor="middle">performed</text><circle cx="758.0" cy="70" r="7" fill="#5b4fd6"/><text x="758.0" y="110" font-size="11" font-weight="mono" text-anchor="middle">ran</text><circle cx="840.0" cy="70" r="7" fill="#0969da"/><text x="840.0" y="96" font-size="11" font-weight="mono" text-anchor="middle">answered</text><rect x="10" y="130" width="420" height="88" rx="10" fill="#ece9ff" stroke="#5b4fd6" stroke-width="1.4"/><text x="28" y="156" font-size="13.5" font-weight="650" class="mono">teagent --replay FILE</text><text x="28" y="180" font-size="12" class="muted">answers come from the log only</text><text x="28" y="200" font-size="12" class="muted">the new event stream must equal the log</text><rect x="450" y="130" width="420" height="88" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/><text x="468" y="156" font-size="13.5" font-weight="650" class="mono">teagent --resume FILE</text><text x="468" y="180" font-size="12" class="muted">the log until it ends, then live</text><text x="468" y="200" font-size="12" class="muted">a crash mid-session costs no repeated model calls</text></svg>