<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 276" width="880" height="276" role="img"><style>
text { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; fill: #e8ecef; }
.muted { fill: #7f8790; }
.dim { fill: #4b5158; }
.red { fill: #ff3d3d; }
.amber { fill: #ffb21e; }
.green { fill: #34e089; }
.cyan { fill: #5cc8ff; }
.flow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -28; } }
.blink { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .flow, .blink { animation: none; } }
</style><rect x="0.5" y="0.5" width="879" height="275" rx="12" fill="#050607" stroke="#1b1e22" stroke-width="1"/><line x1="0" y1="34" x2="880" y2="34" stroke="#16191c"/><circle cx="18" cy="17" r="3.5" fill="#ff3d3d" class="blink"/><text x="30" y="21" font-size="10" font-weight="600" text-anchor="start" xml:space="preserve" letter-spacing="2" class="muted">TEAGENT // FILE 04 · JOURNAL</text><text x="864" y="21" font-size="10" font-weight="700" text-anchor="end" xml:space="preserve" letter-spacing="2.5" class="red">RESTRICTED</text><text x="18" y="60" font-size="13.5" font-weight="650" text-anchor="start" xml:space="preserve">Every session is a log of what the world answered</text><rect x="16" y="76" width="520" height="138" rx="6" fill="#0c0e10" stroke="#24282d" stroke-width="1.2"/><text x="30" y="100" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" class="cyan">{&quot;task&quot;: &quot;…&quot;, &quot;abi&quot;: 2, &quot;image&quot;: &quot;4b17…c6c&quot;}</text><text x="30" y="124" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">{&quot;wrote&quot;: &quot;```elm module Main …&quot;}</text><text x="30" y="148" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">{&quot;performed&quot;: {&quot;tool&quot;: {&quot;read&quot;: &quot;lib/a.ml&quot;}, …}}</text><text x="30" y="172" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" class="amber">{&quot;held&quot;: {&quot;diff&quot;: &quot;+++ b/AGENTS.md …&quot;, &quot;decision&quot;: &quot;discard&quot;}}</text><text x="30" y="196" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" class="green">{&quot;committed&quot;: [&quot;lib/a.ml&quot;]}</text><line x1="536" y1="112" x2="590" y2="112" stroke="#4b5158" stroke-width="1.4" class="flow"/><path d="M590,112 l-7,-4 v8 z" fill="#4b5158" transform="rotate(0.0 590 112)"/><line x1="536" y1="178" x2="590" y2="178" stroke="#4b5158" stroke-width="1.4" class="flow"/><path d="M590,178 l-7,-4 v8 z" fill="#4b5158" transform="rotate(0.0 590 178)"/><rect x="590" y="84" width="274" height="56" rx="6" fill="#121518" stroke="#5cc8ff" stroke-width="1.2"/><text x="604" y="106" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" class="cyan">--replay</text><text x="604" y="126" font-size="9.5" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">no model, no disk; checks every event</text><rect x="590" y="150" width="274" height="56" rx="6" fill="#121518" stroke="#34e089" stroke-width="1.2"/><text x="604" y="172" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" class="green">--resume</text><text x="604" y="192" font-size="9.5" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">plays the log, then goes on live</text><text x="16" y="238" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" class="muted">a log names its ABI and the hash of its OS. another build, same ABI: same events.</text><text x="16" y="256" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" class="dim">labels of values are never logged; the interpreter computes them again.</text></svg>