<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" role="img"><style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #59636e; }
    .accent { fill: #5b4fd6; }
    .flow { stroke-dasharray: 7 9; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style><text x="4" y="18" font-size="14.5" font-weight="650">A contained shell: the command sees your staged edits and changes nothing real</text><rect x="10" y="60" width="180" height="150" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/><text x="100" y="88" font-size="14" font-weight="650" text-anchor="middle">workspace</text><text x="100" y="114" font-size="11.5" class="muted" text-anchor="middle">your files on disk</text><text x="100" y="150" font-size="11.5" class="muted" text-anchor="middle">untouched until</text><text x="100" y="168" font-size="11.5" class="muted" text-anchor="middle">you approve</text><line x1="194" y1="135" x2="286" y2="135" stroke="#59636e" stroke-width="1.8" class="flow"/><polygon points="286,135 279.7,138.0 279.7,132.0" fill="#59636e"/><text x="240" y="124" font-size="11" class="muted" text-anchor="middle">APFS clone</text><text x="240" y="156" font-size="11" class="muted" text-anchor="middle">+ staged edits</text><rect x="292" y="44" width="300" height="196" rx="14" fill="#ffebe9" stroke="#cf222e" stroke-width="1.4" stroke-dasharray="6 5"/><text x="442" y="66" font-size="12.5" font-weight="650" text-anchor="middle" style="fill:#cf222e">Seatbelt sandbox</text><rect x="322" y="80" width="240" height="96" rx="10" fill="#fff4d6" stroke="#9a6700" stroke-width="1.4"/><text x="442" y="106" font-size="14" font-weight="650" text-anchor="middle">clone</text><text x="442" y="128" font-size="11.5" font-weight="mono" text-anchor="middle">dune test, npm install, sh …</text><text x="442" y="150" font-size="11.5" class="muted" text-anchor="middle">may write and delete here</text><text x="442" y="200" font-size="12" text-anchor="middle" style="fill:#cf222e">no network</text><text x="442" y="220" font-size="12" text-anchor="middle" style="fill:#cf222e">no writes outside the clone</text><line x1="598" y1="135" x2="690" y2="135" stroke="#59636e" stroke-width="1.8" class="flow"/><polygon points="690,135 683.7,138.0 683.7,132.0" fill="#59636e"/><text x="644" y="124" font-size="11" class="muted" text-anchor="middle">files written</text><text x="644" y="156" font-size="11" class="muted" text-anchor="middle">or deleted</text><rect x="696" y="60" width="174" height="150" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/><text x="783" y="88" font-size="14" font-weight="650" text-anchor="middle">staged changes</text><text x="783" y="112" font-size="11.5" class="muted" text-anchor="middle">one diff with the</text><text x="783" y="130" font-size="11.5" class="muted" text-anchor="middle">model's own edits</text><text x="783" y="166" font-size="11.5" class="muted" text-anchor="middle">approve: commit</text><text x="783" y="184" font-size="11.5" class="muted" text-anchor="middle">or discard all</text></svg>