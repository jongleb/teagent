<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img"><style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #9198a1; }
    .accent { fill: #a5a0ff; }
    .flow { stroke-dasharray: 7 9; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style><text x="4" y="18" font-size="14.5" font-weight="650">What main in 01_rename evaluates to: data, not actions</text><rect x="10" y="40" width="300" height="46" rx="23" fill="#262350" stroke="#a5a0ff" stroke-width="1.4"/><text x="28" y="60" font-size="13" font-weight="650" class="mono">And_then</text><text x="28" y="76" font-size="11" class="muted">callback  \_ -&gt; shell "dune test"</text><rect x="70" y="116" width="300" height="46" rx="23" fill="#262350" stroke="#a5a0ff" stroke-width="1.4"/><text x="88" y="136" font-size="13" font-weight="650" class="mono">And_then</text><text x="88" y="152" font-size="11" class="muted">callback  \matches -&gt; batch of edits</text><rect x="130" y="192" width="330" height="46" rx="23" fill="#2e2410" stroke="#d29922" stroke-width="1.4"/><text x="148" y="212" font-size="13" font-weight="650" class="mono">Tool (Grep)</text><text x="148" y="228" font-size="11" class="muted">pattern "Foo\.bar", glob "**/*.ml"</text><path d="M 40 86 L 40 135 L 66 135" fill="none" stroke="#9198a1" stroke-width="1.5"/><path d="M 100 162 L 100 211 L 126 211" fill="none" stroke="#9198a1" stroke-width="1.5"/><rect x="520" y="40" width="350" height="198" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4"/><text x="538" y="66" font-size="13.5" font-weight="650">Why it matters</text><text x="538" y="94" font-size="12.5" class="muted">The interpreter ran no effect to build this.</text><text x="538" y="120" font-size="12.5" class="muted">Callbacks are closures of the program: data too.</text><text x="538" y="146" font-size="12.5" class="muted">A handler walks the tree: run, staged, replay.</text><text x="538" y="172" font-size="12.5" class="muted">Stopping at a tool returns the rest as a tree,</text><text x="538" y="198" font-size="12.5" class="muted">so a plan can be shown, saved or resumed.</text><text x="10" y="272" font-size="12" class="muted">grep runs first; its matches feed the edits; the edits feed dune test.</text></svg>